<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1b2a40" />
    <script>
      try {
        if (localStorage.getItem('snapcut-theme') === 'light') document.documentElement.classList.add('light');
      } catch (_) {}
    </script>
    <meta
      name="description"
      content="Snapcut finds the best moments in your videos and exports vertical clips. Your video never leaves your device."
    />
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
    <title>Snapcut</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
